name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      # 修改点 1：添加 node: 24，强制该插件底层使用 Node 24 运行
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          node: 24
      # 修改点 2：将 node-version 升级为 24，并添加 node: 24
      - uses: actions/setup-node@v4
        with:
          node-version: 24  # 构建网站使用的 Node.js 版本
          cache: npm
          node: 24          # 强制该插件底层使用 Node 24 运行

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4